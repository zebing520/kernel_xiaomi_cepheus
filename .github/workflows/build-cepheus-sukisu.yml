name: Build cepheus 4.14 + SukiSU Nova (Non-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source (Android 11 / eleven branch)
        uses: actions/checkout@v4
        with:
          ref: eleven
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc ccache curl git zip unzip \
            libncurses-dev cpio flex bison libssl-dev python3

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$HOME/AnyKernel3"

      - name: Clone SukiSU Nova kernel tree (v3.0.0)
        run: |
          git clone --depth=1 --branch v3.0.0 \
            https://github.com/SukiSU-Nova/SukiSU-Nova.git "$HOME/SukiSU-Nova"

      - name: Integrate SukiSU Nova into kernel source
        run: |
          set -e
          # Symlink must point at $HOME/SukiSU-Nova/kernel, NOT a relative
          # ../ path (which resolves to the runner work dir and does not exist).
          rm -rf drivers/kernelsu
          ln -s "$HOME/SukiSU-Nova/kernel" drivers/kernelsu

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '0,/endmenu/s//source "drivers\/kernelsu\/Kconfig"\nendmenu/' drivers/Kconfig
          fi

          echo "--- drivers/kernelsu ---"
          ls -l drivers/kernelsu
          echo "--- Makefile tail ---"
          tail -5 drivers/Makefile
          echo "--- Kconfig source line ---"
          grep -n 'kernelsu' drivers/Kconfig

      - name: Enable SukiSU / kprobe config
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/cepheus_defconfig

          set_cfg() {
            key="$1"
            val="$2"
            if grep -q "^# ${key} is not set$" "$DEFCONFIG"; then
              sed -i "s/^# ${key} is not set$/${key}=${val}/" "$DEFCONFIG"
            elif grep -q "^${key}=" "$DEFCONFIG"; then
              sed -i "s/^${key}=.*$/${key}=${val}/" "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          # SukiSU Nova Kconfig: KSU depends on KPROBES and EXT4_FS.
          # kprobe hook needs kallsyms to resolve kernel symbol addresses.
          set_cfg CONFIG_KPROBES y
          set_cfg CONFIG_KPROBE_EVENTS y
          set_cfg CONFIG_EXT4_FS y
          set_cfg CONFIG_KALLSYMS y
          set_cfg CONFIG_KALLSYMS_ALL y
          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_MANUAL_SU y

          # KPM is intentionally OFF for first build on 4.14.
          echo "# CONFIG_KPM is not set" >> "$DEFCONFIG"

          echo "--- selected options ---"
          grep -E 'CONFIG_(KPROBES|KPROBE_EVENTS|EXT4_FS|KSU|KPM|KALLSYMS)' "$DEFCONFIG" || true

      - name: Patch dtc to avoid libyaml link
        run: |
          set -e
          # The runner has /usr/include/yaml.h so dtc tries to build yamltree.o
          # and link -lyaml, but the cross linker cannot resolve it. dtc's YAML
          # output is irrelevant for booting, so force the NO_YAML path.
          sed -i 's|ifeq ($(wildcard /usr/include/yaml.h),)|ifeq (,)|' scripts/dtc/Makefile
          grep -n -A4 'NO_YAML\|yamltree' scripts/dtc/Makefile

      - name: Patch SukiSU arm64 syscall_fn_t definition
        run: |
          set -e
          # SukiSU-Nova v3.0.0 defines syscall_fn_t only for x86_64/riscv, but
          # arm64 needs it too. On arm64 the syscall entry signature is
          #   long (*)(const struct pt_regs *)
          # which is the same as the riscv branch. Add an arm64 typedef.
          HOOK="$HOME/SukiSU-Nova/kernel/hook/syscall_hook.h"
          # aarch64 uses the exact same syscall_fn_t signature as riscv.
          sed -i 's@#elif defined(__riscv)@#elif defined(__riscv) || defined(__aarch64__)@' "$HOOK"
          echo "--- patched typedef ---"
          grep -n -A8 'defined(__x86_64__)' "$HOOK"

      - name: Build kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH="$HOME/proton-clang"
          export PATH="$CLANG_PATH/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Build host tools (dtc/modpost/genksyms) with system gcc; clang/ld.lld
          # are only for the target kernel.
          MAKE_ARGS="O=out CC=clang CXX=clang++ HOSTCC=gcc HOSTCXX=g++ \
            CROSS_COMPILE=$CLANG_PATH/bin/aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=$CLANG_PATH/bin/arm-linux-gnueabi- LD=ld.lld"

          make $MAKE_ARGS cepheus_defconfig
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee kernel.log

          test -f out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Pack AnyKernel3 flashable zip
        run: |
          set -e
          cp anykernel.sh "$HOME/AnyKernel3/"
          cp out/arch/arm64/boot/Image.gz-dtb "$HOME/AnyKernel3/"
          cd "$HOME/AnyKernel3"
          ZIP_NAME="cepheus-4.14-SukiSU-Nova-v3.0.0-AK3.zip"
          zip -r9 "$GITHUB_WORKSPACE/out/$ZIP_NAME" .
          ls -lh "$GITHUB_WORKSPACE/out/$ZIP_NAME"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-sukisu-nova-kernel
          path: |
            out/*.zip
            kernel.log
          if-no-files-found: error
